<title>Word Wizard – Typing Practice</title>

<style>

</head>

<div id="wrap"><div id="stage">
  <canvas id="game" width="1280" height="720"></canvas>

  <div id="title" class="screen">
    <h1>WORD WIZARD</h1>
    <p>Type the words to cast spells and protect the village!</p>
    <p>単語をタイプして魔法をうち、村を守ろう！</p>
    <div class="panel">
      <p style="color:#ffd55a;margin:0 0 6px">▶ Choose your hero / キャラをえらぼう</p>
      <div id="heroes"></div>
      <p style="color:#ffd55a;margin:10px 0 6px">▶ Choose a word list / 単語リストをえらぼう</p>
      <div id="tabs"></div>
      <div id="listBtns"></div>
    </div>
  </div>

  <div id="over" class="screen hidden">
    <h1>GAME OVER</h1>
    <p id="finalScore" style="font-size:clamp(20px,3vw,34px)"></p>
    <button class="btn b3" id="againBtn">Play again / もう一回</button>
  </div>

  <div id="topBtns" class="hidden">
    <button id="menuBtn" tabindex="-1">❚❚ MENU</button>
    <button id="muteBtn" tabindex="-1">♪ SOUND ON</button>
  </div>

  <div id="pause" class="screen hidden">
    <h1>PAUSED</h1>
    <p style="font-size:clamp(16px,2.4vw,26px)">Back to the menu? / メニューにもどる？</p>
    <div style="margin-top:14px">

      <button class="btn b2" id="quitBtn">Menu<br><small>メニューへ</small></button>
    </div>
  </div>
  <div id="imeWarn" class="hidden">英語入力（A）に切り替えてね！ Switch to English input!</div>

  heal()   { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, "sine", 0.1, 0, i * 0.07)); },
  meteorFall() { tone(1400, 0.45, "square", 0.05, 200); noise(0.45, 0.08, 1200); },
  tornado(){ noise(1.2, 0.25, 800); tone(200, 1.0, "sawtooth", 0.04, 600); },
  over()   { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.3, "triangle", 0.15, 0, i * 0.22)); },
};
const muteBtn = document.getElementById("muteBtn"), topBtns = document.getElementById("topBtns");
muteBtn.addEventListener("click", () => {
  muted = !muted; audioOn();
  if (master) master.gain.value = muted ? 0 : 0.6;
  muteBtn.textContent = muted ? "♪ SOUND OFF" : "♪ SOUND ON";
  muteBtn.blur();
});

// ============================================================
//  GAME FLOW
// ============================================================
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
function nextWord() {
  for (let tries = 0; tries < 30; tries++) {
    if (deck.length === 0) deck = shuffle(WORDS.slice());
    const w = deck.pop();
    if (!enemies.some(e => e.word.en === w.en)) return w;
  }
  return WORDS[Math.random() * WORDS.length | 0];
}

function startGame(words) {
  audioOn();
  if (document.activeElement) document.activeElement.blur();
  WORDS = words;
  enemies = []; fireballs = []; particles = []; floaters = [];
  target = null; typed = "";
  score = 0; lives = 5; wave = 0; combo = 0; shake = 0;
  deck = [];
  mana = 0; known = []; spellMode = false; spellTyped = ""; freezeTimer = 0; flash = 0;
  bolts = []; meteors = []; tornados = []; learned = null; learnTimer = 0;
  state = "play";
  document.getElementById("title").classList.add("hidden");
  topBtns.classList.remove("hidden");
  document.getElementById("over").classList.add("hidden");
  nextWave();
}

function nextWave() {
  wave++;
  spawnLeft = 4 + wave * 2;
  spawnTimer = 1.5;
  waveBanner = 2.2;
  bossState = "waiting";       // waiting -> warning -> fighting -> done
  bannerText = "- WAVE " + wave + " -";
  SFX.wave();
}

// ---- BOSS SETTINGS ----
// how many words it takes to beat the boss on each wave
function bossHp(w) { return 3 + Math.floor((w - 1) / 2); }   // wave1-2: 3, wave3-4: 4, ...
const BOSS_DAMAGE = 2;         // hearts lost if the boss reaches the village
let bossState = "done", bossTimer = 0, bannerText = "";

function spawnBoss() {
  const hp = bossHp(wave);
  const look = (wave - 1) % OGRES.length;
  const w = nextWord();
  enemies.push({
    boss: true, img: OGRES[look], type: { burst: OGRE_COLORS[look].burst },
    word: w, jp: !!w.jp && Math.random() < JP_CHANCE,
    hp, maxHp: hp, pending: hp,
    x: W + 80, y: 590, baseY: 590,
    speed: BOSS_SPEED + wave * 3,
    t: 0, hitFlash: 0, dying: false, knock: 0, lastStep: 0,
  });
}

function spawnEnemy() {
  const t = ENEMY_TYPES[Math.random() * ENEMY_TYPES.length | 0];
  const lanes = t.fly ? AIR_LANES : GROUND_LANES;
  const y = lanes[Math.random() * lanes.length | 0];
  const w = nextWord();
  enemies.push({
    type: t, word: w, jp: !!w.jp && Math.random() < JP_CHANCE,
    x: W + 60, y, baseY: y,
    speed: BASE_SPEED + wave * 7 + Math.random() * 12,
    t: Math.random() * 6, hitFlash: 0, dying: false,
  });
}

// ============================================================
//  TYPING
// ============================================================
function answerOf(e) { return e.word.en.toLowerCase(); }

window.addEventListener("keydown", (ev) => {
  if (state !== "play") return;
  audioOn();
  if (ev.key === "Process" || ev.isComposing || ev.keyCode === 229) { showIme(); ev.preventDefault(); return; }
  if (ev.key === "Backspace" || ev.key === "Escape") { target = null; typed = ""; spellMode = false; ev.preventDefault(); return; }
  if (ev.key === " ") {
    ev.preventDefault();
    if (!spellMode && target) {                        // in the middle of a word/phrase
      if (answerOf(target)[typed.length] === " ") { typed += " "; SFX.key(typed.length); }
      else miss();
      return;
    }
    toggleSpellMode(); return;
  }
  if (ev.key.length !== 1) return;
  const k = ev.key.toLowerCase();
  if (!/[a-z'-]/.test(k)) return;
  ev.preventDefault();

  if (spellMode) { typeSpell(k); return; }

  if (!target) {
    const choices = enemies.filter(e => !e.dying && answerOf(e)[0] === k).sort((a, b) => a.x - b.x);
    if (choices.length === 0) { miss(); return; }
    target = choices[0];
    typed = k;
  } else {
    const ans = answerOf(target);
    if (ans[typed.length] === k) typed += k;
    else { miss(); return; }
  }
  sparkle(ORB.x, ORB.y, 3);
  if (typed === answerOf(target)) castSpell(target);
  else SFX.key(typed.length);
});

// ============================================================
//  SPELLS — charge MANA with correct words, press SPACE, type the spell name.
//  A new spell is learned after each boss (in this order).
// ============================================================
const SPELLS = [
  { name: "freeze",  jp: "こおらせる", color: "#9fe8ff", info: "Slow all monsters / モンスターがおそくなる" },
  { name: "thunder", jp: "かみなり",   color: "#ffe45a", info: "Hit every monster / 全部のモンスターにあたる" },
  { name: "heal",    jp: "かいふく",   color: "#7cf08a", info: "Get 1 heart back / ハートが1つもどる" },
  { name: "meteor",  jp: "いんせき",   color: "#ff8a3d", info: "Big damage to the boss / ボスに大ダメージ" },
  { name: "tornado", jp: "たつまき",   color: "#c9b6ff", info: "Blow monsters back / モンスターをふきとばす" },
];
const MANA_MAX = 100;
function manaFor(len) { return 10 + len * 2; }     // a 5-letter word gives 20 mana

let mana = 0, known = [], spellMode = false, spellTyped = "";
let freezeTimer = 0, bolts = [], meteors = [], tornados = [], learned = null, learnTimer = 0;

function gainMana(len) { if (known.length) mana = Math.min(MANA_MAX, mana + manaFor(len)); }

function toggleSpellMode() {
  if (spellMode) { spellMode = false; spellTyped = ""; return; }
  if (!known.length) { floaters.push({ x: W / 2, y: H - 140, text: "No spells yet! / まだ魔法がない", life: 1.2, small: true }); SFX.miss(); return; }
  if (mana < MANA_MAX) { floaters.push({ x: W / 2, y: H - 140, text: "Mana not full! / MPがたりない", life: 1.2, small: true }); SFX.miss(); return; }
  spellMode = true; spellTyped = ""; target = null; typed = "";
  SFX.spellReady();
}

function typeSpell(k) {
  const next = spellTyped + k;
  if (!known.some(s => s.name.startsWith(next))) { SFX.miss(); shake = 0.15; return; }
  spellTyped = next;
  sparkle(ORB.x, ORB.y, 4);
  const s = known.find(s => s.name === spellTyped);
  if (s) { castMagic(s); spellMode = false; spellTyped = ""; mana = 0; }
  else SFX.key(spellTyped.length);
}

function alive() { return enemies.filter(e => !e.dying && !e.dead); }

// damage any enemy instantly (used by spells)
function zap(e, hits = 1) {
  if (e.dying || e.dead) return;
  if (e.boss) {
    for (let i = 0; i < hits && e.pending > 0; i++) { e.pending--; e.hp--; }
    if (target === e) { target = null; typed = ""; }
    if (e.pending <= 0) { killBoss(e); return; }
    const w = nextWord(); e.word = w; e.jp = !!w.jp && Math.random() < JP_CHANCE;
    e.hitFlash = 0.3; e.knock = 60;
    burst(e.x, e.y - 56, e.type.burst, 20);
    score += 50; floaters.push({ x: e.x, y: e.y - 160, text: "+50", life: 1 });
  } else {
    e.dead = true;
    if (target === e) { target = null; typed = ""; }
    burst(e.x, e.y - 28, e.type.burst, 22);
    score += 20; floaters.push({ x: e.x, y: e.y - 70, text: "+20", life: 1 });
  }
}

function killBoss(e) {
  e.dead = true;
  const tx = e.x, ty = e.y - 56;
  for (let i = 0; i < 4; i++) burst(tx + (Math.random() - .5) * 80, ty + (Math.random() - .5) * 80, e.type.burst, 30);
  burst(tx, ty, ["#ffd55a", "#fff3a8", "#ff9a2e"], 50);
  shake = 0.6; SFX.bossDie();
  score += 100 * wave;
  floaters.push({ x: tx, y: ty - 120, text: "BOSS DEFEATED!", life: 1.8, big: true });
  learnNextSpell();
}

function learnNextSpell() {
  if (known.length >= SPELLS.length) return;
  learned = SPELLS[known.length];
  known.push(learned);
  learnTimer = 3.2;
  setTimeout(() => SFX.learn(), 900);
}

function castMagic(s) {
  shake = 0.3;
  floaters.push({ x: W / 2, y: 340, text: s.name.toUpperCase() + "!", life: 1.2, big: true, color: s.color });
  if (s.name === "freeze") {
    freezeTimer = 5; SFX.freeze();
    for (const e of alive()) burst(e.x, e.y - 30, ["#9fe8ff", "#ffffff", "#5fc8ff"], 10);
  }
  if (s.name === "thunder") {
    SFX.thunder();
    for (const e of alive()) { bolts.push(makeBolt(e)); zap(e, 1); }
    flash = 0.25;
  }
  if (s.name === "heal") {
    lives = Math.min(5, lives + 1); SFX.heal();
    for (let i = 0; i < 24; i++) particles.push({ x: 24 + Math.random() * 200, y: 60, vx: (Math.random() - .5) * 60, vy: -60 - Math.random() * 120, life: 1, max: 1, c: Math.random() < .5 ? "#7cf08a" : "#fff", s: 2, g: 0 });
  }
  if (s.name === "meteor") {
    const boss = alive().find(e => e.boss);
    const tgt = boss || alive().sort((a, b) => a.x - b.x)[0];
    const tx = tgt ? tgt.x : W * 0.6, ty = tgt ? tgt.y - 30 : 540;
    meteors.push({ x: tx + 500, y: -80, tx, ty, target: tgt });
    SFX.meteorFall();
  }
  if (s.name === "tornado") {
    SFX.tornado();
    tornados.push({ x: ORB.x, life: 1.4 });
    for (const e of alive()) e.knock = e.boss ? 260 : 420;
  }
}

function makeBolt(e) {
  const pts = []; let x = L(e.x) + (Math.random() * 20 - 10 | 0);
  const end = L(e.y) - 8;
  for (let y = 0; y <= end; y += 6) { pts.push([x, y]); x += (Math.random() * 7 | 0) - 3; }
  pts.push([L(e.x), end]);
  return { pts, life: 0.35 };
}

let flash = 0;
function updateMagic(dt) {
  if (freezeTimer > 0) {
    freezeTimer -= dt;
    if (Math.random() < dt * 30) particles.push({ x: Math.random() * W, y: -10, vx: (Math.random() - .5) * 40, vy: 80 + Math.random() * 80, life: 4, max: 4, c: "#e8f8ff", s: 1, g: 0 });
  }
  if (flash > 0) flash -= dt;
  if (learnTimer > 0) learnTimer -= dt;
  for (const b of bolts) b.life -= dt;
  bolts = bolts.filter(b => b.life > 0);
  for (const m of meteors) {
    const dx = m.tx - m.x, dy = m.ty - m.y, d = Math.hypot(dx, dy), sp = 1100 * dt;
    for (let i = 0; i < 3; i++) particles.push({ x: m.x + (Math.random() - .5) * 30, y: m.y + (Math.random() - .5) * 30, vx: 0, vy: -30, life: .4, max: .4, c: ["#ffd55a", "#ff8a3d", "#ff4a2e", "#6b4a3a"][Math.random() * 4 | 0], s: 2, g: 0 });
    if (d <= sp) {
      m.done = true; shake = 0.7; flash = 0.15; SFX.boom(); SFX.bossHit();
      burst(m.tx, m.ty, ["#ffd55a", "#ff8a3d", "#ff4a2e", "#6b4a3a"], 60);
      for (const e of alive()) {
        if (e.boss) zap(e, 2);
        else if (Math.abs(e.x - m.tx) < 260) zap(e, 1);
      }
    } else { m.x += dx / d * sp; m.y += dy / d * sp; }
  }
  meteors = meteors.filter(m => !m.done);
  for (const t of tornados) { t.x += 900 * dt; t.life -= dt; }
  tornados = tornados.filter(t => t.life > 0 && t.x < W + 200);
}

function drawMagic() {
  if (freezeTimer > 0) { lx.fillStyle = `rgba(140,210,255,${Math.min(.22, freezeTimer * .1)})`; lx.fillRect(0, 0, LW, LH); }
  for (const b of bolts) {
    for (let i = 1; i < b.pts.length; i++) {
      const [x0, y0] = b.pts[i - 1], [x1, y1] = b.pts[i];
      const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
      for (let j = 0; j <= n; j++) {
        const x = Math.round(x0 + (x1 - x0) * j / n), y = Math.round(y0 + (y1 - y0) * j / n);
        lx.fillStyle = "#ffe45a"; lx.fillRect(x - 1, y, 3, 1);
        lx.fillStyle = "#fff"; lx.fillRect(x, y, 1, 1);
      }
    }
  }
  for (const m of meteors) {
    const x = L(m.x), y = L(m.y);
    lx.fillStyle = "#1a1033"; lx.fillRect(x - 5, y - 4, 10, 8); lx.fillRect(x - 4, y - 5, 8, 10);
    lx.fillStyle = "#8a5a3a"; lx.fillRect(x - 4, y - 3, 8, 6); lx.fillRect(x - 3, y - 4, 6, 8);
    lx.fillStyle = "#ff8a3d"; lx.fillRect(x - 3, y - 3, 3, 3); lx.fillStyle = "#ffd55a"; lx.fillRect(x - 2, y - 2, 1, 1);
  }
  for (const t of tornados) {
    const cx = L(t.x);
    for (let i = 0; i < 40; i++) {
      const y = 150 - i * 2, w = 3 + i * 0.6, off = Math.round(Math.sin(clock * 14 + i * 0.4) * (2 + i * .15));
      lx.fillStyle = i % 3 === 0 ? "#ffffff" : (i % 3 === 1 ? "#c9b6ff" : "#8a7ad0");
      lx.fillRect(cx - Math.round(w / 2) + off, y, Math.round(w), 1);
    }
  }
}

let imeTimer = 0;
function showIme() { document.getElementById("imeWarn").classList.remove("hidden"); imeTimer = 2.5; }

function miss() {
  combo = 0;
  shake = 0.2;
  if (target) target.hitFlash = 0.15;
  SFX.miss();
}

function castSpell(e) {
  combo++;
  let pts = 10 * e.word.en.length + Math.min(combo, 10) * 5;
  let final = true;
  if (e.boss) {
    e.pending--;
    final = e.pending <= 0;
    if (!final) { const w = nextWord(); e.word = w; e.jp = !!w.jp && Math.random() < JP_CHANCE; }  // next word right away
  }
  if (final) e.dying = true;
  score += pts;
  gainMana(e.word.en.length);
  SFX.cast();
  fireballs.push({ x: ORB.x, y: ORB.y, target: e, pts, final, big: !!e.boss });
  sparkle(ORB.x, ORB.y, 10);
  target = null; typed = "";
}

// ============================================================
//  UPDATE
// ============================================================
function update(dt) {
  clock += dt;
  if (imeTimer > 0) { imeTimer -= dt; if (imeTimer <= 0) document.getElementById("imeWarn").classList.add("hidden"); }
  if (state !== "play") { updateFx(dt); return; }

  if (waveBanner > 0) waveBanner -= dt;
  if (shake > 0) shake -= dt;

  if (spawnLeft > 0) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnEnemy(); spawnLeft--;
      spawnTimer = Math.max(1.2, 3.4 - wave * 0.25) + Math.random();
    }
  } else if (bossState === "waiting" && enemies.length === 0 && fireballs.length === 0) {
    bossState = "warning"; bossTimer = 2.2;
    bannerText = "!! BOSS !!"; waveBanner = 2.2;
    SFX.bossWarn();
  } else if (bossState === "warning") {
    bossTimer -= dt;
    if (bossTimer <= 0) { spawnBoss(); bossState = "fighting"; }
  } else if (bossState === "fighting" && enemies.length === 0 && fireballs.length === 0) {
    bossState = "done";
    bossTimer = learnTimer > 0 ? learnTimer + 0.3 : 1.5;
  } else if (bossState === "done") {
    bossTimer -= dt;
    if (bossTimer <= 0) nextWave();
  }

  updateMagic(dt);
  const slow = freezeTimer > 0 ? 0.2 : 1;
  for (const e of enemies) {
    e.t += dt * slow;
    if (e.hitFlash > 0) e.hitFlash -= dt;
    if (e.dying) continue;
    if (e.knock > 0) { const k = Math.min(e.knock, 600 * dt); e.x = Math.min(W + 40, e.x + k); e.knock -= k; }
    else e.x -= e.speed * dt * slow;
    if (e.boss) {
      const step = Math.floor(e.t * 2);
      if (step !== e.lastStep) { e.lastStep = step; SFX.stomp(); }
    } else {
      e.y = e.baseY + (e.type.fly ? Math.round(Math.sin(e.t * 3) * 4) * PX : 0);
    }
    if (e.x < WALL_X + (e.boss ? 40 : 0)) {
      e.dead = true;
      lives -= e.boss ? BOSS_DAMAGE : 1; shake = e.boss ? 0.7 : 0.4; combo = 0;
      SFX.hurt();
      burst(WALL_X, e.y - 20, ["#77748f", "#9a97b3", "#55526e"], e.boss ? 40 : 16);
      if (target === e) { target = null; typed = ""; }
      if (lives <= 0) endGame();
    }
  }
  enemies = enemies.filter(e => !e.dead);

  for (const f of fireballs) {
    if (f.target.dead) { f.done = true; sparkle(f.x, f.y, 6); continue; }
    const tx = f.target.x, ty = f.target.y - (f.big ? 56 : 28);
    const dx = tx - f.x, dy = ty - f.y, d = Math.hypot(dx, dy);
    const sp = 1300 * dt;
    particles.push({ x: f.x, y: f.y, vx: (Math.random() - .5) * 80, vy: (Math.random() - .5) * 80, life: .3, max: .3, c: CHARACTERS[hero].fire[Math.random() * 3 | 0], s: 2, g: 0 });
    if (d <= sp) {
      f.done = true;
      const e = f.target;
      if (f.final) {
        if (e.boss) killBoss(e);
        else {
          e.dead = true;
          burst(tx, ty, e.type.burst, 26);
          burst(tx, ty, CHARACTERS[hero].fire, 18);
          SFX.boom();
        }
      } else {                                   // boss takes a hit but keeps going
        e.hp--; e.hitFlash = 0.25; e.knock = 70; shake = 0.25;
        burst(tx, ty, e.type.burst, 16);
        burst(tx, ty, CHARACTERS[hero].fire, 14);
        SFX.bossHit();
      }
      floaters.push({ x: tx, y: ty - 50, text: "+" + f.pts, life: 1 });
    } else { f.x += dx / d * sp; f.y += dy / d * sp; }
  }
  fireballs = fireballs.filter(f => !f.done);
  enemies = enemies.filter(e => !e.dead);

  updateFx(dt);
}

function updateFx(dt) {
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  for (const f of floaters) { f.y -= 50 * dt; f.life -= dt; }
  floaters = floaters.filter(f => f.life > 0);
}

function burst(x, y, cols, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 120 + Math.random() * 320;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120, life: .5 + Math.random() * .5, max: 1,
      c: cols[Math.random() * cols.length | 0], s: 1 + (Math.random() * 2 | 0), g: 700 });
  }
}
function sparkle(x, y, n) {
  for (let i = 0; i < n; i++) particles.push({ x, y, vx: (Math.random() - .5) * 200, vy: -Math.random() * 200, life: .4, max: .4, c: Math.random() < .5 ? "#9fe8ff" : "#fff", s: 1, g: 200 });
}

function endGame() {
  state = "over";
  target = null; typed = "";
  SFX.over();
  topBtns.classList.add("hidden");
  document.getElementById("finalScore").textContent = `Score ${score}　Wave ${wave}`;
  setTimeout(() => document.getElementById("over").classList.remove("hidden"), 700);
}

// ============================================================
//  DRAW
// ============================================================
function L(v) { return Math.round(v / PX); }   // full coords -> low-res pixel

function draw() {
  // ---- world (low-res) ----
  lx.save();
  if (shake > 0) lx.translate(Math.round((Math.random() - .5) * 4), Math.round((Math.random() - .5) * 4));
  lx.drawImage(bg, 0, 0);
  for (const s of stars) if (s.tw && Math.sin(clock * 3 + s.ph) > 0.6) { lx.fillStyle = "#fff"; lx.fillRect(s.x, s.y, 1, 1); lx.fillStyle = "rgba(255,255,255,.5)"; lx.fillRect(s.x - 1, s.y, 3, 1); lx.fillRect(s.x, s.y - 1, 1, 3); }

  drawWizard();
  // enemies sorted back-to-front so lower lanes overlap
  for (const e of [...enemies].sort((a, b) => a.y - b.y)) drawEnemy(e);
  for (const f of fireballs) {
    const x = L(f.x), y = L(f.y);
    const F = CHARACTERS[hero].fire;
    lx.fillStyle = F[0]; lx.fillRect(x - 2, y - 1, 5, 3); lx.fillRect(x - 1, y - 2, 3, 5);
    lx.fillStyle = F[2]; lx.fillRect(x - 1, y - 1, 3, 3);
    lx.fillStyle = "#fff"; lx.fillRect(x, y, 1, 1);
  }
  drawMagic();
  for (const p of particles) { if (p.life / p.max < .3 && (Math.floor(clock * 30) & 1)) continue; lx.fillStyle = p.c; lx.fillRect(L(p.x), L(p.y), p.s, p.s); }
  lx.restore();

  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(low, 0, 0, W, H);
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,230,${flash * 2})`; ctx.fillRect(0, 0, W, H); }

  // ---- crisp overlay: labels, HUD ----
  if (waveBanner > 0 && state === "play" && !(waveBanner < .5 && Math.floor(clock * 16) & 1))
    text(bannerText, W / 2, 200, 84, bossState === "warning" ? "#ff5a5a" : "#ffd55a", bossState === "warning" ? "#1a1033" : "#b4404f");
  for (const e of enemies) drawLabel(e);
  for (const f of floaters) { if (f.life < .3 && (Math.floor(clock * 20) & 1)) continue; text(f.text, Math.max(260, Math.min(W - 260, f.x)), f.y, f.big ? 56 : f.small ? 26 : 36, f.color || "#ffd55a", "#1a1033"); }
  drawHud();
}

function drawWizard() {
  const bob = Math.floor(clock * 2) % 2;
  const C = CHARACTERS[hero], SPR = C.spr;
  const x = 55, y = 76 - SPR.height + bob;   // standing on the tower
  // staff
  lx.fillStyle = "#1a1033"; lx.fillRect(x + 15, y + 2, 3, 22);
  lx.fillStyle = "#8a5a32"; lx.fillRect(x + 16, y + 3, 1, 20);
  lx.drawImage(SPR, x, y);
  // glowing orb
  const ox = L(ORB.x), oy = L(ORB.y) + bob;
  const casting = !!target;
  const pulse = (Math.floor(clock * (casting ? 12 : 3)) % 2);
  lx.globalAlpha = 0.35; lx.fillStyle = casting ? C.fire[1] : C.orb;
  lx.fillRect(ox - 4 - pulse, oy - 3, 9 + pulse * 2, 7); lx.fillRect(ox - 3, oy - 4 - pulse, 7, 9 + pulse * 2);
  lx.globalAlpha = 1;
  lx.fillStyle = "#1a1033"; lx.fillRect(ox - 2, oy - 2, 5, 5);
  lx.fillStyle = casting ? C.fire[1] : C.orb; lx.fillRect(ox - 1, oy - 1, 3, 3);
  lx.fillStyle = "#fff"; lx.fillRect(ox - 1, oy - 1, 1, 1);
}

function drawEnemy(e) {
  if (e.dying) return drawEnemyShape(e, true);
  drawEnemyShape(e, false);
}
function drawEnemyShape(e, dying) {
  if (e.boss) {
    const fr = e.img, stomp = Math.floor(e.t * 4) % 2;
    const img = (e.hitFlash > 0 && Math.floor(clock * 30) & 1) ? fr.flash : fr;
    const x = L(e.x) - (fr.width >> 1), y = L(e.y) - fr.height - stomp;
    lx.fillStyle = "rgba(20,10,40,.4)"; lx.fillRect(x + 3, L(e.y) - 1, fr.width - 6, 2);
    lx.drawImage(img, x, y);
    // club
    lx.fillStyle = "#1a1033"; lx.fillRect(x - 3, y + 8 + stomp, 5, 12); lx.fillRect(x - 2, y + 18 + stomp, 3, 4);
    lx.fillStyle = "#8a5a32"; lx.fillRect(x - 2, y + 9 + stomp, 3, 10);
    lx.fillStyle = "#5e3a1e"; lx.fillRect(x - 2, y + 11 + stomp, 1, 1); lx.fillRect(x, y + 14 + stomp, 1, 1);
    return;
  }
  const fr = e.type.frames[Math.floor(e.t * e.type.anim / 2) % 2];
  const img = (e.hitFlash > 0 || (dying && Math.floor(clock * 20) & 1)) ? fr.flash : fr;
  const x = L(e.x) - (fr.width >> 1), y = L(e.y) - fr.height;
  // shadow
  if (!e.type.fly) { lx.fillStyle = "rgba(20,10,40,.35)"; lx.fillRect(x + 2, L(e.y) - 1, fr.width - 4, 2); }
  else { lx.fillStyle = "rgba(20,10,40,.25)"; lx.fillRect(L(e.x) - 4, 148, 8, 1); }
  lx.drawImage(img, x, y);
}

function text(s, x, y, size, fill, stroke, align = "center") {
  ctx.font = `${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = "middle";
  if (stroke) {
    ctx.fillStyle = stroke;
    const o = Math.max(2, size / 12 | 0);
    for (const [dx, dy] of [[-o, 0], [o, 0], [0, -o], [0, o], [-o, -o], [o, o], [-o, o], [o, -o], [o, o + o]]) ctx.fillText(s, x + dx, y + dy);
  }
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
}

function pixelBox(x, y, w, h, fill, border, shadow = true) {
  x = Math.round(x / 4) * 4; y = Math.round(y / 4) * 4; w = Math.round(w / 4) * 4; h = Math.round(h / 4) * 4;
  if (shadow) { ctx.fillStyle = "rgba(10,5,25,.45)"; ctx.fillRect(x + 8, y + 8, w, h); }
  ctx.fillStyle = "#1a1033"; ctx.fillRect(x + 4, y, w - 8, h); ctx.fillRect(x, y + 4, w, h - 8);
  ctx.fillStyle = border; ctx.fillRect(x + 8, y + 4, w - 16, h - 8); ctx.fillRect(x + 4, y + 8, w - 8, h - 16);
  ctx.fillStyle = fill; ctx.fillRect(x + 8, y + 8, w - 16, h - 16);
  return { x, y, w, h };
}

function drawLabel(e) {
  if (e.dying) return;
  const isT = e === target;
  const ans = e.word.en;
  const fr = e.boss ? e.img : e.type.frames[0];
  const h = e.jp ? 84 : 52;
  const ly = e.y - fr.height * PX - (e.boss ? 44 : 16) - h / 2;
  if (e.boss) {           // HP bar: one block per word left
    const bw = 28, gap = 6, total = e.maxHp * (bw + gap) - gap;
    const bx = Math.round((e.x - total / 2) / 4) * 4, by = Math.round((ly - h / 2 - 34) / 4) * 4;
    ctx.fillStyle = "#1a1033"; ctx.fillRect(bx - 6, by - 6, total + 12, 28);
    for (let i = 0; i < e.maxHp; i++) {
      const on = i < e.hp;
      ctx.fillStyle = on ? "#ff4d6d" : "#3d2a5c"; ctx.fillRect(bx + i * (bw + gap), by, bw, 16);
      if (on) { ctx.fillStyle = "#ffc2cf"; ctx.fillRect(bx + i * (bw + gap), by, bw, 4); }
    }
  }

  ctx.font = `30px ${FONT}`;
  const main = e.jp ? e.word.jp : ans;
  const sub = e.jp ? ans.split("").map((c, i) => c === " " ? " " : (isT && i < typed.length) ? c : "_").join(" ") : null;
  let w = ctx.measureText(main).width;
  if (sub) { ctx.font = `26px ${FONT}`; w = Math.max(w, ctx.measureText(sub).width); }
  w += 36;

  const b = pixelBox(e.x - w / 2, ly - h / 2, w, h, isT ? "#ffd55a" : "#f4e4c1", isT ? "#e8590c" : "#8a6a9a");
  // little pointer under the box
  ctx.fillStyle = "#1a1033"; ctx.fillRect(Math.round(e.x / 4) * 4 - 8, b.y + b.h, 16, 4); ctx.fillRect(Math.round(e.x / 4) * 4 - 4, b.y + b.h + 4, 8, 4);

  const cy = b.y + b.h / 2;
  if (!e.jp) {
    ctx.font = `30px ${FONT}`; ctx.textAlign = "left"; ctx.textBaseline = "middle";
    const full = ctx.measureText(ans).width;
    let x = e.x - full / 2;
    const done = isT ? typed.length : 0;
    ctx.fillStyle = "#c2410c"; ctx.fillText(ans.slice(0, done), x, cy);
    x += ctx.measureText(ans.slice(0, done)).width;
    ctx.fillStyle = "#1a1033"; ctx.fillText(ans.slice(done), x, cy);
  } else {
    text(main, e.x, cy - 15, 30, "#1a1033");
    text(sub, e.x, cy + 18, 26, isT ? "#c2410c" : "#6b5a7a");
  }
}

function drawHud() {
  if (state === "title") return;
  ctx.imageSmoothingEnabled = false;
  for (let i = 0; i < 5; i++) ctx.drawImage(i < lives ? HEART : HEART_EMPTY, 24 + i * 40, 20, 7 * 4, 6 * 4);
  text("SCORE " + score, W - 28, 34, 36, "#f4e4c1", "#1a1033", "right");
  text("WAVE " + wave, W / 2, 34, 32, "#f4e4c1", "#1a1033");
  if (combo >= 3) text(combo + " COMBO!", W - 28, 80, 28, "#ffd55a", "#1a1033", "right");
  if (state !== "play") return;
  const cursor = Math.floor(clock * 2) % 2 ? "_" : " ";
  const full = mana >= MANA_MAX && known.length > 0;

  // typing box
  if (spellMode) {
    const b = pixelBox(W / 2 - 240, H - 92, 480, 72, "#4a1f7a", "#ffd55a");
    if (spellTyped) text("✦ " + spellTyped + cursor, W / 2, b.y + b.h / 2, 38, "#ffd55a");
    else text("✦ type a spell! / 魔法の名前", W / 2, b.y + b.h / 2, 28, "#d8c2ff");
  } else {
    const b = pixelBox(W / 2 - 240, H - 92, 480, 72, "#2a1b4f", "#f4e4c1");
    if (typed) text(typed + cursor, W / 2, b.y + b.h / 2, 38, "#ffd55a");
    else text("type… / タイプしよう", W / 2, b.y + b.h / 2, 30, "#8a7aaa");
  }

  // mana bar (left)
  const mb = pixelBox(20, H - 88, 360, 64, "#1f1540", full ? "#ffd55a" : "#8a6a9a");
  text("MP", mb.x + 34, mb.y + mb.h / 2, 26, "#c9b6ff");
  const bx = mb.x + 64, by = mb.y + 20, bw = mb.w - 84, bh = 24;
  ctx.fillStyle = "#0e0a1f"; ctx.fillRect(bx, by, bw, bh);
  const fillW = Math.round(bw * mana / MANA_MAX / 4) * 4;
  ctx.fillStyle = full ? (Math.floor(clock * 6) % 2 ? "#ffd55a" : "#ffb13d") : "#7a5cff"; ctx.fillRect(bx, by, fillW, bh);
  ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.fillRect(bx, by, fillW, 4);
  if (full && !spellMode) text("SPACE!", bx + bw / 2, by + bh / 2, 22, "#1a1033");
  if (!known.length) text("Beat a boss to learn magic!", bx + bw / 2, by + bh / 2, 17, "#8a7aaa");

  // spellbook (right)
  const sx0 = W - 400, sy0 = H - 96;
  if (known.length) {
    known.forEach((s, i) => {
      const col = i % 3, row = Math.floor(i / 3);
      const x = sx0 + col * 128, y = sy0 + row * 42;
      const match = spellMode && spellTyped && s.name.startsWith(spellTyped);
      const ready = full || spellMode;
      const b = pixelBox(x, y, 120, 40, match ? "#ffd55a" : ready ? "#4a1f7a" : "#2a1b4f", ready ? s.color : "#5a4a6a", false);
      text(s.name, b.x + b.w / 2, b.y + b.h / 2, 20, match ? "#1a1033" : ready ? "#ffffff" : "#8a7aaa");
    });
  }

  // "new spell learned" popup
  if (learnTimer > 0 && learnTimer < 2.4 && learned) {
    const b = pixelBox(W / 2 - 380, 230, 760, 236, "#2a1b4f", learned.color);
    text("NEW SPELL! / 新しい魔法をおぼえた！", W / 2, b.y + 40, 28, "#f4e4c1");
    text(learned.name.toUpperCase() + "  (" + learned.jp + ")", W / 2, b.y + 96, 56, learned.color, "#1a1033");
    text(learned.info, W / 2, b.y + 152, 24, "#d8c2ff");
    text("MPがたまったら SPACE → " + learned.name, W / 2, b.y + 192, 22, "#ffd55a");
  }
}

// ============================================================
//  LOOP
// ============================================================
function loop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000 || 0);
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// build the tabs + word-list buttons
const listBtns = document.getElementById("listBtns"), tabs = document.getElementById("tabs");
const colors = ["b1", "b2", "b3"];
let currentGroup = "topic";
try { currentGroup = localStorage.getItem("ww-group") || "topic"; } catch (e) {}
function showGroup(id) {
  currentGroup = id;
  try { localStorage.setItem("ww-group", id); } catch (e) {}
  tabs.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.g === id));
  listBtns.innerHTML = "";
  if (id === "eiken") { showDecks(); return; }
  const lists = LISTS.filter(Ls => Ls.group === id);
  lists.forEach((Ls, i) => {
    const b = document.createElement("button");
    b.className = "btn " + colors[i % 3];
    b.innerHTML = `${Ls.name}<br><small>${Ls.sub}</small>`;
    b.addEventListener("click", () => startGame(parseList(Ls.words)));
    listBtns.appendChild(b);
  });
  const allBtn = document.createElement("button");
  allBtn.className = "btn b4";
  allBtn.innerHTML = "Mix All<br><small>ぜんぶミックス</small>";
  allBtn.addEventListener("click", () => startGame(lists.flatMap(Ls => parseList(Ls.words))));
  listBtns.appendChild(allBtn);
}
function deckWords(secs) { return secs.flatMap(sec => sec.words.map(([en, jp]) => ({ en, jp }))); }
function showDecks() {
  listBtns.innerHTML = "";
  DECKS.forEach((d, i) => {
    const b = document.createElement("button");
    b.className = "btn " + colors[i % 3];
    b.innerHTML = `${d.title}<br><small>${deckWords(d.sections).length} words ▶</small>`;
    b.addEventListener("click", () => showSections(d));
    listBtns.appendChild(b);
  });
}
function showSections(d) {
  listBtns.innerHTML = "";
  const top = document.createElement("div");
  const back = document.createElement("button");
  back.className = "btn sbtn"; back.style.background = "#5a4a6a"; back.textContent = "◀ Back / もどる";
  back.addEventListener("click", showDecks);
  const all = document.createElement("button");
  all.className = "btn b4"; all.innerHTML = `${d.title} ALL<br><small>ぜんぶ (${deckWords(d.sections).length})</small>`;
  all.addEventListener("click", () => startGame(deckWords(d.sections)));
  top.append(back, all); listBtns.appendChild(top);
  const groups = [...new Set(d.sections.map(s => s.group))];
  groups.forEach((g, gi) => {
    const secs = d.sections.filter(s => s.group === g);
    const h = document.createElement("div"); h.className = "sgroup"; h.textContent = "▼ " + g; listBtns.appendChild(h);
    const row = document.createElement("div");
    const gAll = document.createElement("button");
    gAll.className = "btn sbtn b4"; gAll.textContent = `All (${deckWords(secs).length})`;
    gAll.addEventListener("click", () => startGame(deckWords(secs)));
    row.appendChild(gAll);
    secs.forEach(sec => {
      const b = document.createElement("button");
      b.className = "btn sbtn " + colors[gi % 3];
      b.textContent = sec.title.split(" ・ ").reverse().join(" ・ ").replace(/ ・ .*/, "") + ` (${sec.words.length})`;
      b.title = sec.title;
      b.addEventListener("click", () => startGame(deckWords([sec])));
      row.appendChild(b);
    });
    listBtns.appendChild(row);
  });
}
// hero picker
const heroesDiv = document.getElementById("heroes");
CHARACTERS.forEach((c, i) => {
  const b = document.createElement("button");
  b.className = "hero" + (i === hero ? " on" : "");
  const cv2 = document.createElement("canvas"); cv2.width = 19; cv2.height = 23;
  cv2.getContext("2d").drawImage(c.spr, 0, 0);
  b.appendChild(cv2);
  b.insertAdjacentHTML("beforeend", `${c.name}<br><small>${c.sub}</small>`);
  b.addEventListener("click", () => {
    hero = i; try { localStorage.setItem("ww-hero", i); } catch (e) {}
    heroesDiv.querySelectorAll(".hero").forEach((h, j) => h.classList.toggle("on", j === i));
    audioOn(); SFX.spellReady();
  });
  heroesDiv.appendChild(b);
});
GROUPS.forEach(g => {
  const t = document.createElement("button");
  t.className = "tab"; t.dataset.g = g.id; t.textContent = `${g.name} / ${g.sub}`;
  t.addEventListener("click", () => showGroup(g.id));
  tabs.appendChild(t);
});
showGroup(GROUPS.some(g => g.id === currentGroup) ? currentGroup : "topic");

function goToMenu() {
  document.getElementById("over").classList.add("hidden");
  document.getElementById("pause").classList.add("hidden");
  document.getElementById("title").classList.remove("hidden");
  topBtns.classList.add("hidden");
  state = "title"; enemies = []; fireballs = []; target = null; typed = ""; spellMode = false;
  freezeTimer = 0; bolts = []; meteors = []; tornados = []; learnTimer = 0;
}
document.getElementById("againBtn").addEventListener("click", goToMenu);
document.getElementById("quitBtn").addEventListener("click", goToMenu);
document.getElementById("menuBtn").addEventListener("click", (ev) => {
  ev.currentTarget.blur();
  if (state !== "play") return;
  state = "paused"; target = null; typed = ""; spellMode = false;
  document.getElementById("pause").classList.remove("hidden");
});
document.getElementById("resumeBtn").addEventListener("click", (ev) => {
  ev.currentTarget.blur();
  document.getElementById("pause").classList.add("hidden");
  state = "play"; lastTime = performance.now();
});
</script>
